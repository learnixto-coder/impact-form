<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="تقارير النشاط">
<meta name="theme-color" content="#08404C">
<title>بطاقة تنفيذ الفترات اللاصفية</title>
<style>
  /* غلاف بملء الشاشة لتطبيق Apps Script: يُخفي شريط تحذير Google الذي يظهر عند الفتح المباشر */
  html, body { margin: 0; height: 100%; background: #f4f6f7; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  .loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font: 15px "Segoe UI", Tahoma, sans-serif; color: #08404C; }
  .loading a { color: #08404C; }
</style>
</head>
<body>
<div class="loading" id="loading">جارٍ فتح بطاقة تنفيذ الفترات اللاصفية…</div>
<iframe id="app" title="تقارير النشاط الطلابي"
  src="https://script.google.com/macros/s/AKfycbw12FsdQ9zDxbBztTNd0RKFKMzL9p225JQZO4RB29_zEQihpREevPGHZt05JgDEN1K7/exec"
  allow="clipboard-write; fullscreen"></iframe>
<script>window.PAGE_QUERY = '?page=periods';</script>
<script>
  // تمرير خيارات الرابط إلى النظام (مثل ?page=periods لبطاقة الفترات اللاصفية)
  (function () { var f = document.getElementById('app'), q = window.PAGE_QUERY || location.search; if (q) f.src = f.src.split('?')[0] + q; })();
  document.getElementById('app').addEventListener('load', function () { document.getElementById('loading').hidden = true; });
  // إن لم يُفتح خلال 20 ثانية: رابط مباشر بديل
  setTimeout(function () {
    var l = document.getElementById('loading');
    if (!l.hidden) l.innerHTML = 'تأخر الفتح. <a href="https://script.google.com/macros/s/AKfycbw12FsdQ9zDxbBztTNd0RKFKMzL9p225JQZO4RB29_zEQihpREevPGHZt05JgDEN1K7/exec?page=periods">افتحي الرابط المباشر</a>';
  }, 20000);
</script>
</body>
</html>
